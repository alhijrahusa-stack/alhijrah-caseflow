name: Public intake final bilingual upgrade

on:
  push:
    branches:
      - public-intake-final-bilingual-20261001

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-intake-final-bilingual-20261001
          fetch-depth: 0
      - name: Apply presentation-only upgrade
        run: python tools/public_intake_finalize_once.py
      - name: Verify public intake invariants
        shell: bash
        run: |
          set -euo pipefail
          FILE=career-gate/public/career-gate.html
          grep -q "const LOCALE_KEY='alhijrah.career.locale.v1'" "$FILE"
          grep -q '/brand/career-gate.webp' "$FILE"
          grep -q '/brand/alhijrah-services.webp' "$FILE"
          grep -q 'reviewPersonalGrid' "$FILE"
          grep -q 'submitInFlight' "$FILE"
          grep -q 'payload.submittedAt=j.submittedAt' "$FILE"
          grep -q "fetch('/api/application'" "$FILE"
          grep -q "fetch('/api/track'" "$FILE"
          grep -q "fetch('/api/intake/documents'" "$FILE"
          grep -q 'careergate.official@gmail.com' "$FILE"
          test "$(grep -o 'id=\"consent\"' "$FILE" | wc -l)" -eq 1
          test "$(grep -o 'id=\"submitBtn\"' "$FILE" | wc -l)" -eq 1
          test "$(grep -o 'id=\"receiptScreen\"' "$FILE" | wc -l)" -eq 1
      - name: Commit upgraded public intake
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/public-intake-finalize-once.yml tools/public_intake_finalize_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career-gate/public/career-gate.html
          git commit -m "Public intake: final bilingual premium UX upgrade"
          git push origin HEAD:public-intake-final-bilingual-20261001
