name: Public intake final bilingual upgrade

on:
  push:
    branches: [public-intake-final-bilingual-20261001]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-intake-final-bilingual-20261001
          fetch-depth: 0
      - name: Patch existing public intake presentation only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('career-gate/public/career-gate.html')
          s = path.read_text(encoding='utf-8')
          original = s

          # Keep the existing form/backend flow; upgrade only the presentation layer.
          assert 'career-gate.html' not in path.name or '<form id="form" novalidate>' in s
          assert "fetch('/api/application'" in s
          assert "fetch('/api/track'" in s
          assert "fetch('/api/intake/documents'" in s
          assert "const state={step:1" in s

          s = s.replace(
            'family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap',
            'family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap'
          )

          old_header = '''<header class="topbar">
            <div class="office-lockup"><h1 class="office-name">مكتب الهجرة للاستشارات وخدمات الهجرة والتوظيف</h1></div>
            <div class="portal-lockup"><span class="portal-ar">بوابة التوظيف</span><span class="portal-en">CAREER GATE</span></div>
            <div class="logo" aria-hidden="true">A</div>
          </header>'''
          new_header = '''<header class="topbar" id="publicHeader">
            <div class="office-lockup">
              <img class="office-brand-logo" src="/brand/alhijrah-services.webp" alt="" aria-hidden="true">
              <h1 class="office-name" id="officeName">مكتب الهجرة للاستشارات وخدمات الهجرة والتوظيف</h1>
            </div>
            <div class="portal-lockup">
              <img class="career-brand-logo" src="/brand/career-gate.webp" alt="Career Gate">
              <div class="portal-copy"><span class="portal-ar" id="portalLabel">بوابة التوظيف</span><span class="portal-en">CAREER GATE</span></div>
            </div>
            <div class="header-actions">
              <div class="language-toggle" role="group" aria-label="اختيار اللغة" id="languageToggle">
                <button type="button" id="langAr" data-locale="ar" aria-pressed="true">العربية</button>
                <span aria-hidden="true">|</span>
                <button type="button" id="langEn" data-locale="en" aria-pressed="false">EN</button>
              </div>
            </div>
          </header>'''
          if old_header not in s:
              raise SystemExit('expected header markup not found')
          s = s.replace(old_header, new_header, 1)

          # Consent remains one state only, but moves to the final review step where it is explicit.
          consent_block = '''    <div class="divider">الموافقة</div>
              <label class="choice" id="consentChoice"><input type="checkbox" id="consent" required><span class="box"></span><span>أؤكد صحة البيانات وأوافق على معالجة الطلب والتواصل بخصوصه.</span></label>
          '''
          if consent_block not in s:
              raise SystemExit('expected consent block not found')
          s = s.replace(consent_block, '', 1)

          review_markup = '''<section class="panel page review-page" data-page="4">
            <div class="pad">
              <div class="review-hero-row">
                <div>
                  <div class="eyebrow" id="reviewEyebrow">REVIEW &amp; SUBMIT</div>
                  <h3 class="section-title" id="reviewTitle">المراجعة والإرسال</h3>
                  <p class="muted review-intro" id="reviewIntro">راجع بياناتك، وأجرِ أي تعديل مطلوب، ثم أرسل الطلب.</p>
                </div>
                <div class="review-person">
                  <div class="review-photo" id="reviewPhoto">A</div>
                  <div><strong id="reviewClientName">—</strong><span id="reviewClientSub">CAREER GATE</span></div>
                </div>
              </div>

              <div class="review-section" data-review-section="personal">
                <div class="review-section-head"><div><span class="review-section-code">01</span><h4 id="reviewPersonalHeading">البيانات الشخصية</h4></div><button class="btn review-edit" type="button" data-edit-step="1" id="editPersonal">تعديل</button></div>
                <div class="review-grid review-full-grid" id="reviewPersonalGrid"></div>
              </div>

              <div class="review-section" data-review-section="experience">
                <div class="review-section-head"><div><span class="review-section-code">02</span><h4 id="reviewExperienceHeading">الخبرة والتفضيلات</h4></div><button class="btn review-edit" type="button" data-edit-step="2" id="editExperience">تعديل</button></div>
                <div class="review-grid review-full-grid" id="reviewExperienceGrid"></div>
              </div>

              <div class="review-section" data-review-section="documents">
                <div class="review-section-head"><div><span class="review-section-code">03</span><h4 id="reviewDocumentsHeading">المستندات والتفويض</h4></div><button class="btn review-edit" type="button" data-edit-step="3" id="editDocuments">تعديل</button></div>
                <div class="review-grid review-full-grid" id="reviewDocumentsGrid"></div>
              </div>

              <div class="legal-stack" id="legalStack">
                <article class="legal-card"><h4 id="declarationTitle">إقرار المستخدم</h4><p id="declarationText">أقر بأن المعلومات التي قدمتها صحيحة وكاملة بحسب علمي، وأفهم أن المعلومات غير الدقيقة قد تؤثر في معالجة طلبي. أؤكد موافقتي على تقديم الطلب وفق البيانات الظاهرة أعلاه.</p></article>
                <article class="legal-card"><h4 id="protectionTitle">إقرار حماية البيانات</h4><p id="protectionText">تتم معالجة البيانات والوثائق إلكترونيًا لغرض معالجة الطلب والتحقق التشغيلي والامتثال الإداري، وفق آليات الحماية الفعلية المطبقة في النظام.</p></article>
                <article class="legal-card"><h4 id="sharingTitle">حدود المشاركة</h4><p id="sharingText">يقتصر استخدام ومشاركة البيانات على ما يلزم لإتمام إجراءات الطلب والتحقق التشغيلي والامتثال الإداري وضمن الجهات المشاركة فعليًا في معالجة الطلب.</p></article>
              </div>

              <label class="choice review-consent" id="consentChoice"><input type="checkbox" id="consent" required><span class="box"></span><span id="consentText">أقر بصحة البيانات وأوافق صراحةً على تقديم الطلب وفق المعلومات الظاهرة أعلاه.</span></label>
            </div>
            <div class="bar"><button class="btn ghost" type="button" data-prev="3" id="reviewPrevious">→ السابق</button><span class="meta" id="reviewStepMeta">الخطوة 4 من 4</span><span class="spacer"></span><button class="btn green submit-control" id="submitBtn" type="submit"><span class="submit-label">إرسال الطلب</span><span class="submit-spinner" aria-hidden="true"></span></button></div>
          </section>'''
          s, count = re.subn(r'<section class="panel page" data-page="4">.*?</section>\n</form>', review_markup + '\n</form>', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('review page replacement failed')

          contact_footer = '''<footer class="contact-footer" id="contactFooter">
            <div class="contact-footer-head"><span class="contact-title" id="contactTitle">بيانات التواصل</span><span class="contact-brand">CAREER GATE</span></div>
            <div class="contact-grid">
              <a href="https://wa.me/13139194292" target="_blank" rel="noopener"><span id="contactWhatsappLabel">WhatsApp</span><strong dir="ltr">313-919-4292</strong></a>
              <a href="tel:+13133393566"><span id="contactCallLabel">اتصال</span><strong dir="ltr">313-339-3566</strong></a>
              <a href="mailto:careergate.official@gmail.com"><span>Email</span><strong dir="ltr">careergate.official@gmail.com</strong></a>
            </div>
          </footer>'''
          marker = '</form>\n</div>\n\n<section class="receipt-screen"'
          if marker not in s:
              raise SystemExit('app-shell footer insertion marker missing')
          s = s.replace(marker, '</form>\n' + contact_footer + '\n</div>\n\n<section class="receipt-screen"', 1)

          receipt_markup = '''<section class="receipt-screen" id="receiptScreen">
            <div class="receipt-shell">
              <div class="receipt" id="receiptCard">
                <div class="receipt-brand-row">
                  <img src="/brand/alhijrah-services.webp" alt="" class="receipt-office-logo" aria-hidden="true">
                  <div class="receipt-brand-center"><img src="/brand/career-gate.webp" alt="Career Gate" class="receipt-career-logo"><span>CAREER GATE</span></div>
                  <div class="receipt-language language-toggle" role="group" aria-label="Language"><button type="button" data-locale="ar">العربية</button><span>|</span><button type="button" data-locale="en">EN</button></div>
                </div>
                <div class="receipt-head">
                  <div class="receipt-photo" id="receiptPhoto">A</div>
                  <div>
                    <div class="eyebrow" id="receiptEyebrow">APPLICATION RECEIVED</div>
                    <h2 id="receiptName"></h2>
                    <div class="statusPill" id="receiptStatus">تم استلام طلبك بنجاح</div>
                    <p class="receipt-confirmation" id="receiptConfirmation">تم تسجيل طلبك وإحالته للمراجعة الأولية. احتفظ برقم الملف لمتابعة حالة الطلب.</p>
                    <div class="receipt-case" id="receiptCase"></div>
                    <div class="receipt-time" id="receiptTime"></div>
                  </div>
                </div>
                <div class="receipt-grid" id="receiptGrid"></div>
                <div class="receipt-contact-mini">
                  <a href="https://wa.me/13139194292" target="_blank" rel="noopener"><span>WhatsApp</span><strong dir="ltr">313-919-4292</strong></a>
                  <a href="tel:+13133393566"><span id="receiptCallLabel">اتصال</span><strong dir="ltr">313-339-3566</strong></a>
                  <a href="mailto:careergate.official@gmail.com"><span>Email</span><strong dir="ltr">careergate.official@gmail.com</strong></a>
                </div>
              </div>
              <div class="receipt-actions">
                <button class="btn primary" id="downloadReceipt" type="button">حفظ البطاقة</button>
                <a class="btn green" id="whatsappLink" target="_blank" rel="noopener">واتساب</a>
                <button class="btn ghost" id="newApplication" type="button">طلب جديد</button>
              </div>
            </div>
          </section>'''
          s, count = re.subn(r'<section class="receipt-screen" id="receiptScreen">.*?</section>\n\n<div class="toastwrap"', receipt_markup + '\n\n<div class="toastwrap"', s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('receipt replacement failed')

          extra_css = r'''
