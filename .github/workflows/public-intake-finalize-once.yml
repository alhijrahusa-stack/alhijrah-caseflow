          test "$(grep -o 'id=\"submitBtn\"' "$FILE" | wc -l)" -eq 1
          test "$(grep -o 'id=\"receiptScreen\"' "$FILE" | wc -l)" -eq 1
          node - <<'NODE'
          const fs=require('fs');
