name: OCR lockfile sync
on:
  pull_request:
    paths:
      - "career-gate/package.json"
      - ".github/workflows/ocr-lockfile-sync.yml"
permissions:
  contents: write
jobs:
  lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/smart-open-ocr-engine-20261013'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lock exact dependency graph
        working-directory: career-gate
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit verified lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career-gate/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock Tesseract.js OCR dependency"
            git fetch origin feat/smart-open-ocr-engine-20261013
            git rebase origin/feat/smart-open-ocr-engine-20261013
            git push origin HEAD:feat/smart-open-ocr-engine-20261013
          fi
