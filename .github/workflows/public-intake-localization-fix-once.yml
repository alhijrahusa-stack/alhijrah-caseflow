name: Public intake localization completion
on:
  push:
    branches:
      - public-intake-final-bilingual-20261001
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-intake-final-bilingual-20261001
          fetch-depth: 0
      - run: python tools/public_intake_localization_fix.py
      - name: Verify completed localization runtime
        shell: bash
        run: |
          set -euo pipefail
          F=career-gate/public/career-gate.html
          grep -q 'function renderTrack(a,updates)' "$F"
          grep -q 'function bindLocalizedUploads()' "$F"
          grep -q "filesTooLarge:'Each file must be 4MB or smaller.'" "$F"
          grep -q "document.documentElement.dir=state.locale==='ar'?'rtl':'ltr'" "$F"
          grep -q 'if(submitInFlight)return' "$F"
          grep -q 'payload.submittedAt=j.submittedAt' "$F"
      - name: Commit fix and remove one-time files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/public-intake-localization-fix-once.yml tools/public_intake_localization_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career-gate/public/career-gate.html
          git commit -m "Public intake: complete bilingual runtime localization"
          git push origin HEAD:public-intake-final-bilingual-20261001
