name: Public intake E2E product fix

on:
  push:
    branches: [public-intake-final-bilingual-20261001]
    paths: [.github/workflows/public-intake-e2e-product-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-intake-final-bilingual-20261001
      - name: Patch public intake
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('career-gate/public/career-gate.html')
          s=p.read_text()
          s=s.replace('.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}', '.hp{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;border:0!important;opacity:0}', 1)
          s=s.replace("const __baseSetStep=setStep;setStep=function(n,manageViewport=true){__baseSetStep(n,manageViewport);localizeProgress();if(state.step===4)renderReview()};", "const __baseSetStep=setStep;setStep=function(n,manageViewport=true){__baseSetStep(n,false);localizeProgress();if(state.step===4)renderReview();if(manageViewport){requestAnimationFrame(()=>{const anchor=$('#formProgress');if(!anchor)return;const top=Math.max(0,anchor.getBoundingClientRect().top+window.scrollY-10);window.scrollTo({top,behavior:'auto'})})}};", 1)
          old="const __baseInit=init;init=function(){state.locale=(localStorage.getItem(LOCALE_KEY)==='en'?'en':'ar');__baseInit();$$('.language-toggle button[data-locale]').forEach(b=>b.addEventListener('click',()=>{state.locale=b.dataset.locale;try{localStorage.setItem(LOCALE_KEY,state.locale)}catch{}localizeStatic()}));$$('[data-edit-step]').forEach(b=>b.addEventListener('click',()=>setStep(+b.dataset.editStep,true)));$('#newApplication').onclick=()=>{localStorage.removeItem(CONFIG.storageKey);location.href='/career-gate.html'};$('#email').dir='ltr';$('#phone').dir='ltr';$('#zip').dir='ltr';setupFocusLaser();bindLocalizedUploads();localizeStatic()};"
          new="const __baseInit=init;init=function(){state.locale=(localStorage.getItem(LOCALE_KEY)==='en'?'en':'ar');__baseInit();$$('.language-toggle button[data-locale]').forEach(b=>b.addEventListener('click',()=>switchLocale(b.dataset.locale)));$$('[data-edit-step]').forEach(b=>b.addEventListener('click',()=>setStep(+b.dataset.editStep,true)));$('#newApplication').onclick=()=>{localStorage.removeItem(CONFIG.storageKey);location.href='/career-gate.html'};$('#email').dir='ltr';$('#phone').dir='ltr';$('#zip').dir='ltr';setupFocusLaser();bindLocalizedUploads();localizeStatic();if(!$('#workTypeDeck').querySelector('input[name=workType]'))refreshDynamicDecks();$('#trackBtn').onclick=track;$('#form').onsubmit=submit};"
          if old not in s: raise SystemExit('init target not found')
          s=s.replace(old,new,1)
          extra='''\n/* Public Intake narrow viewport containment */\nhtml,body{max-width:100%;overflow-x:clip}\n.shell,#appShell,form,.panel,.page,.pad,.topbar,.progress-glass,.stepper,.bar,.grid,.shift-deck,.choicegrid,.review-page,.review-section,.contact-footer,.receipt-screen,.receipt-shell,.receipt{min-width:0;max-width:100%}\nimg,canvas,input,select,textarea,button{max-width:100%}\n@media(max-width:560px){.shell{width:100%;max-width:100%;margin-inline:0}.topbar,.panel,.progress-glass,.contact-footer,.receipt-screen,.receipt{width:100%;max-width:100%}.stepper{grid-template-columns:1fr}.bar{flex-wrap:wrap;min-width:0}.bar .spacer{min-width:0}.pay-table{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.pay-table table{min-width:640px;max-width:none}.language-toggle{max-width:100%;flex-wrap:wrap;justify-content:center}}\n'''
          if 'Public Intake narrow viewport containment' not in s:
              s=s.replace('</style>',extra+'</style>',1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career-gate/public/career-gate.html
          git commit -m "fix: stabilize public intake runtime UX"
          git push origin HEAD:public-intake-final-bilingual-20261001
