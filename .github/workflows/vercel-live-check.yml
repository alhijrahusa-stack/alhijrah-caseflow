name: Vercel production check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-vercel-production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment and verify live app
        env:
          PRODUCTION_URL: https://alhijrah-caseflow.vercel.app
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 24); do
            root_status=$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --output /tmp/vercel-root.html \
              --write-out '%{http_code}' \
              -H 'cache-control: no-cache' \
              "$PRODUCTION_URL/" || true)

            staff_status=$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --output /tmp/vercel-staff.html \
              --write-out '%{http_code}' \
              -H 'cache-control: no-cache' \
              "$PRODUCTION_URL/staff/login" || true)

            root_title=$(grep -o '<title>[^<]*</title>' /tmp/vercel-root.html | head -1 || true)
            staff_title=$(grep -o '<title>[^<]*</title>' /tmp/vercel-staff.html | head -1 || true)
            env_error=no
            startup_error=no
            grep -Eqi 'required environment variables are missing|Setup Required' /tmp/vercel-root.html /tmp/vercel-staff.html && env_error=yes || true
            grep -Eqi 'Startup Error' /tmp/vercel-root.html /tmp/vercel-staff.html && startup_error=yes || true
            echo "attempt=$attempt root_status=$root_status staff_status=$staff_status root_title=${root_title:-none} staff_title=${staff_title:-none} env_error=$env_error startup_error=$startup_error"

            if [ "$root_status" = "200" ] \
              && [ "$staff_status" = "200" ] \
              && grep -q '<title>بوابة التوظيف — Career Gate</title>' /tmp/vercel-root.html \
              && grep -q 'Career Gate' /tmp/vercel-root.html \
              && grep -q '<title>Office · Career Gate</title>' /tmp/vercel-staff.html \
              && grep -q 'Career Gate employment intake platform operated by ALHIJRAH VISA &amp; IMMIGRATION SERVICES LLC' /tmp/vercel-staff.html \
              && [ "$env_error" = "no" ] \
              && [ "$startup_error" = "no" ]; then
              ok=true
              break
            fi

            sleep 5
          done

          if [ "$ok" != true ]; then
            echo '--- ROOT RESPONSE START ---'
            head -c 3000 /tmp/vercel-root.html || true
            echo
            echo '--- ROOT RESPONSE END ---'
            echo '--- STAFF RESPONSE START ---'
            head -c 3000 /tmp/vercel-staff.html || true
            echo
            echo '--- STAFF RESPONSE END ---'
            exit 1
          fi

          echo 'LIVE_URL=https://alhijrah-caseflow.vercel.app'
          echo 'ROOT_HTTP_STATUS=200'
          echo 'STAFF_LOGIN_HTTP_STATUS=200'
          echo 'APP_MARKER=CAREER_GATE'
          echo 'ENV_ERROR_PAGE=ABSENT'
