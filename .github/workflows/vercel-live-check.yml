name: Vercel production check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-vercel-production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel deployment and verify live app
        env:
          PRODUCTION_URL: https://alhijrah-caseflow.vercel.app
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 24); do
            status=$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --output /tmp/vercel-root.html \
              --write-out '%{http_code}' \
              -H 'cache-control: no-cache' \
              "$PRODUCTION_URL/?verify=$GITHUB_SHA&attempt=$attempt" || true)

            title=$(grep -o '<title>[^<]*</title>' /tmp/vercel-root.html | head -1 || true)
            env_error=no
            startup_error=no
            grep -qi 'required environment variables are missing\|Setup Required' /tmp/vercel-root.html && env_error=yes || true
            grep -qi 'Startup Error' /tmp/vercel-root.html && startup_error=yes || true
            echo "attempt=$attempt status=$status title=${title:-none} env_error=$env_error startup_error=$startup_error"

            if [ "$status" = "200" ] \
              && grep -q '<title>Alhijrah Caseflow</title>' /tmp/vercel-root.html \
              && grep -q 'ALHIJRAH CASEFLOW' /tmp/vercel-root.html \
              && [ "$env_error" = "no" ] \
              && [ "$startup_error" = "no" ]; then
              ok=true
              break
            fi

            sleep 5
          done

          if [ "$ok" != true ]; then
            echo '--- LIVE RESPONSE START ---'
            head -c 4000 /tmp/vercel-root.html || true
            echo
            echo '--- LIVE RESPONSE END ---'
            exit 1
          fi

          echo 'LIVE_URL=https://alhijrah-caseflow.vercel.app'
          echo 'HTTP_STATUS=200'
          echo 'APP_MARKER=ALHIJRAH CASEFLOW'
          echo 'ENV_ERROR_PAGE=ABSENT'
