name: Gate Job Account Rename Once

on:
  push:
    branches:
      - career-gate/gate-job-account-workspace-20261003

permissions:
  contents: write

jobs:
  rename:
    if: ${{ !contains(github.event.head_commit.message, '[gate-job-renamed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: career-gate/gate-job-account-workspace-20261003
      - name: Rename feature and preserve implementation
        shell: bash
        run: |
          set -euo pipefail

          git mv 'career-gate/app/api/staff/amazon-account' 'career-gate/app/api/staff/gate-job-account'
          git mv 'career-gate/app/staff/(app)/amazon-account' 'career-gate/app/staff/(app)/gate-job-account'
          git mv 'career-gate/components/amazon' 'career-gate/components/gate-job-account'
          git mv 'career-gate/lib/amazon' 'career-gate/lib/gate-job-account'
          git mv 'career-gate/e2e/amazon-account.spec.ts' 'career-gate/e2e/gate-job-account.spec.ts'
          git mv 'career-gate/tests/integration/amazon-account.int.test.ts' 'career-gate/tests/integration/gate-job-account.int.test.ts'
          git mv 'career-gate/supabase/migrations/023_amazon_account_workspace.sql' 'career-gate/supabase/migrations/023_gate_job_account_workspace.sql'
          git mv 'career-gate/supabase/migrations/024_amazon_account_audit_actions.sql' 'career-gate/supabase/migrations/024_gate_job_account_audit_actions.sql'

          git mv 'career-gate/components/gate-job-account/AmazonAccountWorkspace.tsx' 'career-gate/components/gate-job-account/GateJobAccountWorkspace.tsx'
          git mv 'career-gate/components/gate-job-account/AmazonEmailVault.tsx' 'career-gate/components/gate-job-account/GateJobEmailVault.tsx'
          git mv 'career-gate/components/gate-job-account/AmazonAccounts.tsx' 'career-gate/components/gate-job-account/GateJobAccounts.tsx'
          git mv 'career-gate/components/gate-job-account/AmazonAccountCard.tsx' 'career-gate/components/gate-job-account/GateJobAccountCard.tsx'
          git mv 'career-gate/components/gate-job-account/AmazonAccountEditor.tsx' 'career-gate/components/gate-job-account/GateJobAccountEditor.tsx'
          git mv 'career-gate/components/gate-job-account/AmazonEmailForm.tsx' 'career-gate/components/gate-job-account/GateJobEmailForm.tsx'
          git mv 'career-gate/components/gate-job-account/AmazonQuickAdd.tsx' 'career-gate/components/gate-job-account/GateJobQuickAdd.tsx'

          python3 <<'PY'
          from pathlib import Path

          roots = [
              Path('career-gate/app/api/staff/gate-job-account'),
              Path('career-gate/app/staff/(app)/gate-job-account'),
              Path('career-gate/components/gate-job-account'),
              Path('career-gate/lib/gate-job-account'),
          ]
          files = []
          for root in roots:
              files.extend(p for p in root.rglob('*') if p.is_file())
          files += [
              Path('career-gate/app/api/cron/maintenance/route.ts'),
              Path('career-gate/app/staff/(app)/client/[id]/page.tsx'),
              Path('career-gate/components/staff/StaffNavigation.tsx'),
              Path('career-gate/e2e/gate-job-account.spec.ts'),
              Path('career-gate/e2e/run.sh'),
              Path('career-gate/tests/integration/gate-job-account.int.test.ts'),
              Path('career-gate/tests/run-integration.sh'),
              Path('career-gate/supabase/migrations/023_gate_job_account_workspace.sql'),
              Path('career-gate/supabase/migrations/024_gate_job_account_audit_actions.sql'),
          ]

          mappings = [
              ('@/components/amazon/', '@/components/gate-job-account/'),
              ('@/lib/amazon/', '@/lib/gate-job-account/'),
              ('/api/staff/amazon-account', '/api/staff/gate-job-account'),
              ('/staff/amazon-account', '/staff/gate-job-account'),
              ('%2Fstaff%2Famazon-account', '%2Fstaff%2Fgate-job-account'),
              ('AmazonAccountWorkspace', 'GateJobAccountWorkspace'),
              ('AmazonEmailVault', 'GateJobEmailVault'),
              ('AmazonAccounts', 'GateJobAccounts'),
              ('AmazonAccountCard', 'GateJobAccountCard'),
              ('AmazonAccountEditor', 'GateJobAccountEditor'),
              ('AmazonEmailForm', 'GateJobEmailForm'),
              ('AmazonQuickAdd', 'GateJobQuickAdd'),
              ('AmazonAccountError', 'GateJobAccountError'),
              ('AmazonEmailSecretRow', 'GateJobEmailSecretRow'),
              ('AmazonAccountSecretRow', 'GateJobAccountSecretRow'),
              ('EncryptedAmazonSecret', 'EncryptedGateJobSecret'),
              ('normalizeAmazonEmail', 'normalizeGateJobEmail'),
              ('AddAmazonEmailSchema', 'AddGateJobEmailSchema'),
              ('AddAmazonEmailInput', 'AddGateJobEmailInput'),
              ('BulkAmazonEmailSchema', 'BulkGateJobEmailSchema'),
              ('UpdateAmazonEmailSchema', 'UpdateGateJobEmailSchema'),
              ('DeleteAmazonEmailSchema', 'DeleteGateJobEmailSchema'),
              ('RevealAmazonEmailSchema', 'RevealGateJobEmailSchema'),
              ('AmazonAssignmentSchema', 'GateJobAssignmentSchema'),
              ('AmazonAccountIdSchema', 'GateJobAccountIdSchema'),
              ('RevealAmazonAccountSchema', 'RevealGateJobAccountSchema'),
              ('UpdateAmazonAccountSchema', 'UpdateGateJobAccountSchema'),
              ('decryptAmazonSecret', 'decryptGateJobSecret'),
              ('encryptAmazonSecret', 'encryptGateJobSecret'),
              ('ensureAmazonEncryptionReady', 'ensureGateJobEncryptionReady'),
              ('amazonErrorResponse', 'gateJobErrorResponse'),
              ('getAmazonVault', 'getGateJobVault'),
              ('addAmazonEmail', 'addGateJobEmail'),
              ('bulkAmazonEmails', 'bulkGateJobEmails'),
              ('updateAmazonEmail', 'updateGateJobEmail'),
              ('deleteAmazonEmail', 'deleteGateJobEmail'),
              ('revealAmazonEmail', 'revealGateJobEmail'),
              ('reserveAmazonEmail', 'reserveGateJobEmail'),
              ('releaseAmazonEmail', 'releaseGateJobEmail'),
              ('confirmAmazonAssignment', 'confirmGateJobAssignment'),
              ('getAmazonAccounts', 'getGateJobAccounts'),
              ('getAmazonAccountForClient', 'getGateJobAccountForClient'),
              ('markAmazonAccountReady', 'markGateJobAccountReady'),
              ('updateAmazonAccount', 'updateGateJobAccount'),
              ('removeAmazonAccount', 'removeGateJobAccount'),
              ('revealAmazonAccount', 'revealGateJobAccount'),
              ('expireAmazonReservations', 'expireGateJobReservations'),
              ('AMAZON_CREDENTIALS_KEY_V1', 'GATE_JOB_CREDENTIALS_KEY_V1'),
              ('career_gate_amazon_credentials_v1', 'career_gate_gate_job_credentials_v1'),
              ('career-gate:amazon_emails', 'career-gate:gate_job_emails'),
              ('career-gate:amazon_accounts', 'career-gate:gate_job_accounts'),
              ('amazon_emails', 'gate_job_emails'),
              ('amazon_accounts', 'gate_job_accounts'),
              ('cg_amazon_', 'cg_gate_job_'),
              ('amazon_account_', 'gate_job_account_'),
              ('amazon_email_', 'gate_job_email_'),
              ('amazon_email_vault', 'gate_job_email_vault'),
              ('amazon_account', 'gate_job_account'),
              ('amazon-account-workspace', 'gate-job-account-workspace'),
              ('amazon-accounts', 'gate-job-accounts'),
              ('amazon-email-vault', 'gate-job-email-vault'),
              ('amazon-account-card', 'gate-job-account-card'),
              ('amazon-account-integration', 'gate-job-account-integration'),
              ('amazon-admin@test.invalid', 'gate-job-admin@test.invalid'),
              ('Amazon account', 'Gate Job account'),
              ('Amazon Account', 'Gate Job Account'),
              ('Amazon email', 'Gate Job email'),
              ('Amazon Email', 'Gate Job Email'),
              ('AMAZON ACCOUNT', 'GATE JOB ACCOUNT'),
              ('AMAZON EMAIL', 'GATE JOB EMAIL'),
              ('AMAZON ACCOUNTS', 'GATE JOB ACCOUNTS'),
              ('AMAZON EMAIL VAULT', 'GATE JOB EMAIL VAULT'),
              ('Amazon credential', 'Gate Job credential'),
              ('Amazon workspace', 'Gate Job workspace'),
              ('Amazon', 'Gate Job'),
          ]

          seen = set()
          for path in files:
              if path in seen or not path.exists():
                  continue
              seen.add(path)
              text = path.read_text()
              for old, new in mappings:
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          if grep -RniE 'Amazon|amazon-account|amazon_emails|amazon_accounts|@/lib/amazon|@/components/amazon' \
              'career-gate/app/api/staff/gate-job-account' \
              'career-gate/app/staff/(app)/gate-job-account' \
              'career-gate/components/gate-job-account' \
              'career-gate/lib/gate-job-account' \
              'career-gate/e2e/gate-job-account.spec.ts' \
              'career-gate/tests/integration/gate-job-account.int.test.ts' \
              'career-gate/supabase/migrations/023_gate_job_account_workspace.sql' \
              'career-gate/supabase/migrations/024_gate_job_account_audit_actions.sql'; then
            echo 'Feature rename left Amazon-specific identifiers' >&2
            exit 1
          fi

          rm -f .github/workflows/gate-job-account-rename-once.yml
          git config user.name 'ALHIJRAH VISA & IMMIGRATION SERVICES LLC'
          git config user.email 'alhijrahusa@gmail.com'
          git add -A
          git commit -m 'Rename feature to Gate Job Account [gate-job-renamed]'
          git push origin HEAD:career-gate/gate-job-account-workspace-20261003
