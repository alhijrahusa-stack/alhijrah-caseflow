name: Career Gate AI SDK lock

on:
  push:
    branches:
      - career-gate-production-upgrade-v2-20260928
    paths:
      - .github/workflows/career-gate-ai-sdk-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: career-gate-production-upgrade-v2-20260928
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: career-gate/package-lock.json
      - name: Install production AI SDK dependencies
        working-directory: career-gate
        run: npm install ai @ai-sdk/openai
      - name: Commit synchronized manifest and lockfile
        run: |
          git config user.name "career-gate-ci"
          git config user.email "alhijrahusa@gmail.com"
          git add career-gate/package.json career-gate/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Install Vercel AI SDK document vision dependencies"
          git push origin HEAD:career-gate-production-upgrade-v2-20260928
