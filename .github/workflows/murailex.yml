name: MURAILEX CI/CD

on:
  push:
    paths: ["murailex/**", ".github/workflows/murailex.yml"]
  pull_request:
    paths: ["murailex/**", ".github/workflows/murailex.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: murailex, POSTGRES_PASSWORD: murailex, POSTGRES_DB: murailex_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U murailex" --health-interval 5s --health-retries 20
    defaults: { run: { working-directory: murailex/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: mypy app
      - run: pytest -q
        env: { TEST_DATABASE_URL: "postgresql+psycopg://murailex:murailex@localhost:5432/murailex_test" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: murailex/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: murailex/frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: murailex, POSTGRES_PASSWORD: murailex, POSTGRES_DB: murailex_e2e }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U murailex" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: murailex/frontend/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
      - working-directory: murailex/backend
        run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - working-directory: murailex/frontend
        run: npm ci && npx playwright install --with-deps chromium && npm run build
      - working-directory: murailex/frontend
        run: npx playwright test
        env: { PW_CHROMIUM: "" }

  images:
    needs: [e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: murailex/backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/murailex-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: murailex/frontend
          push: true
          build-args: BACKEND_INTERNAL_URL=http://api:8000
          tags: ghcr.io/${{ github.repository_owner }}/murailex-web:${{ github.sha }}
