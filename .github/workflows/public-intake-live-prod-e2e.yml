name: Public Intake Live Production E2E

on:
  push:
    branches: [public-intake-final-bilingual-20261001]

permissions:
  contents: read

jobs:
  live-production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: career-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: career-gate/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run live public intake E2E against Vercel production
        env:
          PRODUCTION_URL: https://alhijrah-caseflow.vercel.app/career-gate.html
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          const url = process.env.PRODUCTION_URL;
          const testId = `prodverify-${Date.now()}`;
          const email = `${testId}@example.com`;
          const phone = '+1 313 555 0188';
          const png = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9Z9xkAAAAASUVORK5CYII=', 'base64');
          const pdf = Buffer.from('%PDF-1.4\n1 0 obj<</Type/Catalog>>endobj\ntrailer<</Root 1 0 R>>\n%%EOF\n');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            let applicationPosts = 0;
            let submitResponse = null;
            page.on('request', req => {
              if (req.method() === 'POST' && new URL(req.url()).pathname === '/api/application') applicationPosts += 1;
            });
            page.on('response', async res => {
              if (res.request().method() === 'POST' && new URL(res.url()).pathname === '/api/application') {
                try { submitResponse = await res.json(); } catch {}
              }
            });

            const r = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            assert.equal(r.status(), 200, 'production form must return HTTP 200');
            assert.equal(await page.locator('html').getAttribute('lang'), 'ar');
            assert.equal(await page.locator('html').getAttribute('dir'), 'rtl');
            await page.locator('#firstName').fill('Production');
            await page.locator('#lastName').fill('Verification');
            await page.locator('#phone').fill(phone);
            await page.locator('#email').fill(email);

            await page.locator('[data-next="2"]').click();
            await page.locator('.page.active[data-page="2"]').waitFor({ state: 'visible' });
            await page.locator('#langEn').click();
            assert.equal(await page.locator('html').getAttribute('lang'), 'en');
            assert.equal(await page.locator('html').getAttribute('dir'), 'ltr');
            assert.equal(await page.locator('#firstName').inputValue(), 'Production');
            assert.ok((await page.locator('.title').textContent()).includes('Job Application Form'));

            const workType = page.locator('input[name="workType"]').first();
            await workType.check({ force: true });
            const shift = page.locator('input[name="shift"]').first();
            await shift.check({ force: true });
            await page.locator('[data-next="3"]').click();
            await page.locator('.page.active[data-page="3"]').waitFor({ state: 'visible' });

            await page.locator('#docs').setInputFiles({ name: 'production-verification.pdf', mimeType: 'application/pdf', buffer: pdf });
            await page.locator('#photo').setInputFiles({ name: 'production-verification.png', mimeType: 'image/png', buffer: png });

            const canvas = page.locator('#signature');
            await canvas.scrollIntoViewIfNeeded();
            const box = await canvas.boundingBox();
            assert.ok(box, 'signature canvas must be visible');
            await page.mouse.move(box.x + 25, box.y + 45);
            await page.mouse.down();
            await page.mouse.move(box.x + 90, box.y + 80, { steps: 5 });
            await page.mouse.move(box.x + 155, box.y + 40, { steps: 5 });
            await page.mouse.up();
            await page.locator('#sigWrap.has').waitFor({ state: 'visible' });
            await page.locator('#consentChoice').click();
            assert.equal(await page.locator('#consent').isChecked(), true);

            await page.locator('#langAr').click();
            assert.equal(await page.locator('html').getAttribute('lang'), 'ar');
            assert.equal(await page.locator('#email').inputValue(), email);
            assert.equal(await page.locator('#docs').evaluate(el => el.files.length), 1);
            assert.equal(await page.locator('#photo').evaluate(el => el.files.length), 1);
            assert.ok((await page.locator('#sigWrap').getAttribute('class')).includes('has'));
            assert.equal(await page.locator('#consent').isChecked(), true);
            await page.locator('#langEn').click();

            await page.locator('[data-next="4"]').click();
            await page.locator('.page.active[data-page="4"]').waitFor({ state: 'visible' });
            await page.locator('#reviewClientName').waitFor({ state: 'visible' });
            assert.ok((await page.locator('#reviewClientName').textContent()).includes('Production'));
            assert.ok((await page.locator('#reviewDocumentsGrid').textContent()).includes('production-verification.pdf'));
            await page.locator('#reviewPhoto img').waitFor({ state: 'visible' });

            await page.locator('#editPersonal').click();
            await page.locator('.page.active[data-page="1"]').waitFor({ state: 'visible' });
            assert.equal(await page.locator('#email').inputValue(), email);
            await page.locator('[data-step="4"]').click();
            await page.locator('.page.active[data-page="4"]').waitFor({ state: 'visible' });
            assert.equal(await page.locator('#consent').isChecked(), true);

            await page.locator('#form').evaluate(form => { form.requestSubmit(); form.requestSubmit(); });
            await page.locator('#receiptScreen.active').waitFor({ state: 'visible', timeout: 60000 });
            assert.equal(applicationPosts, 1, 'duplicate submit protection must allow one application POST only');
            assert.ok(submitResponse && submitResponse.ok === true, 'server must confirm successful submission');
            assert.ok(/^ALH-/.test(submitResponse.caseNumber || ''), 'server must issue a real case number');
            assert.ok(submitResponse.submittedAt, 'server must return official submission timestamp');
            assert.equal((await page.locator('#receiptCase').textContent()).trim(), submitResponse.caseNumber);
            assert.notEqual((await page.locator('#receiptTime').textContent()).trim(), '—');

            const trackingHref = await page.locator('#receiptTrackLink').getAttribute('href');
            assert.ok(trackingHref, 'receipt must expose tracking URL');
            await page.goto(new URL(trackingHref, url).href, { waitUntil: 'networkidle', timeout: 60000 });
            await page.locator('#trackResult').waitFor({ state: 'visible', timeout: 30000 });
            assert.ok((await page.locator('#trackResult').textContent()).includes(submitResponse.caseNumber), 'tracking must resolve persisted production application');

            const mobile = await browser.newContext({ viewport: { width: 360, height: 740 }, isMobile: true, hasTouch: true });
            const mp = await mobile.newPage();
            const mr = await mp.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
            assert.equal(mr.status(), 200);
            const widths = await mp.evaluate(() => ({ inner: window.innerWidth, scroll: document.documentElement.scrollWidth }));
            assert.ok(widths.scroll <= widths.inner + 1, `horizontal overflow: ${JSON.stringify(widths)}`);
            assert.equal(await mp.locator('#formProgress').getAttribute('role'), 'progressbar');
            await mp.locator('#langEn').click();
            assert.equal(await mp.locator('#langEn').getAttribute('aria-pressed'), 'true');
            await mobile.close();

            assert.deepEqual(pageErrors, [], `runtime page errors: ${JSON.stringify(pageErrors)}`);
            console.log(`LIVE_PRODUCTION_E2E=PASS case=${submitResponse.caseNumber} submittedAt=${submitResponse.submittedAt}`);
            await context.close();
            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE