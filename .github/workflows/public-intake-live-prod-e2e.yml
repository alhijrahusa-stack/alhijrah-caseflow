name: Public Intake Live Production E2E

on:
  push:
    branches: [public-intake-final-bilingual-20261001]

permissions:
  contents: read

jobs:
  live-production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: career-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: career-gate/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify remaining live production gates
        env:
          PRODUCTION_URL: https://alhijrah-caseflow.vercel.app/career-gate.html
          VERIFIED_CASE: ALH-20260930-0BFE
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const base = process.env.PRODUCTION_URL;
          const caseNumber = process.env.VERIFIED_CASE;
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1280, height: 900 } });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(String(e)));
            const trackUrl = `${base}?track=1&case=${encodeURIComponent(caseNumber)}`;
            const response = await page.goto(trackUrl, { waitUntil: 'networkidle', timeout: 60000 });
            assert.equal(response.status(), 200);
            await page.locator('#trackResult').waitFor({ state: 'visible', timeout: 30000 });
            assert.ok((await page.locator('#trackResult').textContent()).includes(caseNumber), 'production tracking must resolve persisted case');
            await page.locator('#langEn').click();
            assert.equal(await page.locator('html').getAttribute('lang'), 'en');
            assert.ok((await page.locator('#trackResult').textContent()).includes(caseNumber));
            await page.locator('#langAr').click();
            assert.equal(await page.locator('html').getAttribute('lang'), 'ar');
            assert.ok((await page.locator('#trackResult').textContent()).includes(caseNumber));
            assert.deepEqual(errors, []);

            const mobile = await browser.newContext({ viewport: { width: 360, height: 740 }, isMobile: true, hasTouch: true });
            const mp = await mobile.newPage();
            const mobileErrors = [];
            mp.on('pageerror', e => mobileErrors.push(String(e)));
            const mr = await mp.goto(base, { waitUntil: 'networkidle', timeout: 60000 });
            assert.equal(mr.status(), 200);
            const widths = await mp.evaluate(() => ({ inner: window.innerWidth, scroll: document.documentElement.scrollWidth }));
            assert.ok(widths.scroll <= widths.inner + 1, `horizontal overflow: ${JSON.stringify(widths)}`);
            assert.equal(await mp.locator('#formProgress').getAttribute('role'), 'progressbar');
            assert.equal(await mp.locator('#langAr').getAttribute('aria-pressed'), 'true');
            await mp.locator('#langEn').click();
            assert.equal(await mp.locator('#langEn').getAttribute('aria-pressed'), 'true');
            assert.deepEqual(mobileErrors, []);
            console.log(`LIVE_REMAINDER_E2E=PASS case=${caseNumber} mobile=${JSON.stringify(widths)}`);
            await mobile.close();
            await context.close();
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE