name: Public intake runtime syntax fix

on:
  push:
    branches: [public-intake-final-bilingual-20261001]
    paths: [.github/workflows/public-intake-runtime-syntax-fix-once.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-intake-final-bilingual-20261001
      - name: Remove duplicate runtime constant declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('career-gate/public/career-gate.html')
          s=p.read_text()
          needle="const NEXT_AR={'Office will review your application.':'سيقوم المكتب بمراجعة طلبك.','Office will review your information and documents.':'سيقوم المكتب بمراجعة معلوماتك ومستنداتك.','Office will submit your application.':'سيقوم المكتب بتقديم طلبك.','Your application is being submitted.':'يجري تقديم طلبك.','Complete the employer assessment.':'أكمل تقييم جهة العمل.','Wait for pre-hire appointment details.':'انتظر تفاصيل موعد ما قبل التوظيف.','Office will schedule your appointment.':'سيقوم المكتب بتحديد موعدك.','Attend your scheduled appointment.':'احضر موعدك المحدد.','Wait for screening results.':'انتظر نتائج الفحص.','Complete your I-9 documents.':'أكمل مستندات I-9.','Complete remaining post-hire tasks.':'أكمل إجراءات ما بعد التوظيف المتبقية.','Report for your first day.':'باشر يوم عملك الأول.','No further action needed.':'لا يلزم إجراء إضافي.'};"
          count=s.count(needle)
          if count != 2:
              raise SystemExit(f'expected exactly 2 NEXT_AR declarations, found {count}')
          first=s.find(needle)
          second=s.find(needle, first+len(needle))
          s=s[:second]+s[second+len(needle):]
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/public-intake-runtime-syntax-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career-gate/public/career-gate.html .github/workflows/public-intake-runtime-syntax-fix-once.yml
          git commit -m "fix: restore public intake runtime initialization"
          git push origin HEAD:public-intake-final-bilingual-20261001
