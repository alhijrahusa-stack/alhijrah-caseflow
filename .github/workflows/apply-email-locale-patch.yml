name: Apply Public Intake Email Locale Patch

on:
  push:
    branches: [career-gate-postmark-confirmation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: career-gate-postmark-confirmation
          fetch-depth: 0
      - name: Patch locale into existing public intake payload
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('career-gate/public/career-gate.html')
          s = p.read_text()
          old = "uid:state.uid,caseNumber:'',"
          new = "uid:state.uid,caseNumber:'',locale:state.locale==='en'?'en':'ar',"
          if new not in s:
              if old not in s:
                  raise SystemExit('expected collect() anchor not found')
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
          rm .github/workflows/apply-email-locale-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career-gate/public/career-gate.html .github/workflows/apply-email-locale-patch.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: submit active public intake locale"
          git push origin HEAD:career-gate-postmark-confirmation
