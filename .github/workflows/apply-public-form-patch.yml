name: Apply public form reliability patch

# One-shot branch-only patch runner. The generated HTML commit does not match this workflow path.
on:
  push:
    branches: [career-gate-production-upgrade-v2-20260928]
    paths:
      - .github/workflows/apply-public-form-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: career-gate-production-upgrade-v2-20260928
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("career-gate/scripts/patch-public-form.mjs")
          s = p.read_text()
          old = r"/function save\\(\\)\\{.*?\\}\\nfunction restore\\(\\)\\{.*?\\}\\nfunction showReceipt/s,"
          new = r"/function save\\(\\)\\{.*?\\}function restore\\(\\)\\{.*?\\}function showReceipt/s,"
          if old not in s:
              raise SystemExit("draft patch anchor not found")
          p.write_text(s.replace(old, new))
          PY
          node career-gate/scripts/patch-public-form.mjs
      - name: Validate and commit
        run: |
          git diff --check
          test -n "$(git status --porcelain -- career-gate/public/career-gate.html)"
          git config user.name "ALHIJRAH VISA & IMMIGRATION SERVICES LLC"
          git config user.email "alhijrahusa@gmail.com"
          git add career-gate/public/career-gate.html
          git commit -m "Harden current public form draft and upload recovery"
          git push origin HEAD:career-gate-production-upgrade-v2-20260928
