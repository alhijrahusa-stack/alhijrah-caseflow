name: Fix Signature Step Race

on:
  push:
    branches: [career-gate-postmark-confirmation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: career-gate-postmark-confirmation
          fetch-depth: 0
      - name: Remove deferred canvas-resize race on step activation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('career-gate/public/career-gate.html')
          s = p.read_text()
          old = "if(state.step===3)setTimeout(()=>resizeSignature(true),0);"
          new = "if(state.step===3)resizeSignature(true);"
          if old not in s:
              raise SystemExit('signature step resize anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/fix-signature-step-race.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add career-gate/public/career-gate.html .github/workflows/fix-signature-step-race.yml
          git commit -m "fix: remove signature canvas activation race"
          git push origin HEAD:career-gate-postmark-confirmation
