name: MURAILEX Voice — lock and verify Node dependencies
on:
  push:
    branches:
      - feat/murailex-voice-v1
    paths:
      - "murailex/frontend/**"
      - ".github/workflows/murailex-voice-deps.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: murailex/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: murailex/frontend/package-lock.json
      - name: Install exact voice dependencies
        run: npm install groq-sdk@1.6.0 msedge-tts@2.1.1 --save-exact --no-audit --no-fund
      - name: Build production Next.js
        run: npm run build
      - name: Lint
        run: npm run lint -- --max-warnings 0
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Commit deterministic voice package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add murailex/frontend/package.json murailex/frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "MURAILEX_LOCK=UNCHANGED"
          else
            git commit -m "build(murailex): lock Groq and Edge voice packages"
            git push origin HEAD:feat/murailex-voice-v1
          fi
