name: Apply Postmark public intake confirmation

on:
  push:
    branches:
      - career-gate-postmark-email-confirmation

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[postmark-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: career-gate-postmark-email-confirmation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply implementation
        working-directory: career-gate
        run: node scripts/apply-postmark-email-confirmation.mjs
      - name: Remove one-time implementation helpers
        run: |
          rm -f career-gate/scripts/apply-postmark-email-confirmation.mjs
          rm -f .github/workflows/apply-postmark-email-confirmation.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Postmark client confirmation outbox [postmark-applied]"
          git push origin HEAD:career-gate-postmark-email-confirmation
