# Production stack: HTTPS (Caddy/Let's Encrypt) → Next.js PWA + FastAPI API + durable worker,
# PostgreSQL, and private MinIO object storage with versioning, Object Lock and SSE (KMS).
name: murailex
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: murailex
      POSTGRES_USER: murailex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U murailex -d murailex"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?set MINIO_KMS_SECRET_KEY (name:base64-32-bytes)}
    volumes: [objects:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      sh -c "mc alias set m http://minio:9000 $$S3_ACCESS_KEY_ID $$S3_SECRET_ACCESS_KEY &&
             (mc ls m/$$S3_BUCKET >/dev/null 2>&1 || mc mb --with-lock m/$$S3_BUCKET) &&
             mc version enable m/$$S3_BUCKET &&
             mc anonymous set none m/$$S3_BUCKET"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-murailex-evidence}

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://murailex:${POSTGRES_PASSWORD}@db:5432/murailex
      S3_ENDPOINT_URL: http://minio:9000
      APP_BASE_URL: https://${MURAILEX_DOMAIN}
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      retries: 10

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://murailex:${POSTGRES_PASSWORD}@db:5432/murailex
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      api: { condition: service_healthy }
    deploy:
      replicas: 2

  web:
    build:
      context: ./frontend
      args: { BACKEND_INTERNAL_URL: "http://api:8000" }
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      MURAILEX_DOMAIN: ${MURAILEX_DOMAIN:?set MURAILEX_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on: [web, api]

volumes:
  pgdata:
  objects:
  caddy:
